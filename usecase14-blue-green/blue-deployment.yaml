apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-deployment
  namespace: usecase14
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bluegreen-demo
      version: blue
  template:
    metadata:
      labels:
        app: bluegreen-demo
        version: blue
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80