---
# Source: claims-backend-chart/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claims-dev-claims-backend-chart
  labels:
    helm.sh/chart: claims-backend-chart-0.1.0
    app.kubernetes.io/name: claims-backend-chart
    app.kubernetes.io/instance: claims-dev
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: false

---
# Source: claims-backend-chart/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: claims-dev-claims-backend-chart
  labels:
    helm.sh/chart: claims-backend-chart-0.1.0
    app.kubernetes.io/name: claims-backend-chart
    app.kubernetes.io/instance: claims-dev
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: claims-backend-chart
    app.kubernetes.io/instance: claims-dev

---
# Source: claims-backend-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-dev-claims-backend-chart
  labels:
    helm.sh/chart: claims-backend-chart-0.1.0
    app.kubernetes.io/name: claims-backend-chart
    app.kubernetes.io/instance: claims-dev
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: claims-backend-chart
      app.kubernetes.io/instance: claims-dev
  template:
    metadata:
      labels:
        helm.sh/chart: claims-backend-chart-0.1.0
        app.kubernetes.io/name: claims-backend-chart
        app.kubernetes.io/instance: claims-dev
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
        environment: dev
    spec:
      serviceAccountName: claims-dev-claims-backend-chart
      containers:
        - name: claims-backend-chart
          image: "claims-backend:uc15-v1"
          imagePullPolicy: IfNotPresent

          # Environment-specific database Secret
          envFrom:
            - secretRef:
                name: "claims-db-dev"

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
# Source: claims-backend-chart/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod

metadata:
  name: "claims-dev-claims-backend-chart-test-connection"
  labels:
    helm.sh/chart: claims-backend-chart-0.1.0
    app.kubernetes.io/name: claims-backend-chart
    app.kubernetes.io/instance: claims-dev
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test

spec:
  automountServiceAccountToken: false

  containers:
    - name: wget
      image: busybox:1.36.1
      command: ['wget']
      args:
        - 'claims-dev-claims-backend-chart:5000'
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
          ephemeral-storage: 10Mi
        limits:
          cpu: 50m
          memory: 32Mi
          ephemeral-storage: 50Mi

  restartPolicy: Never

