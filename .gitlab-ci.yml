stages:
  - test
  - quality
  - build
  - scan
  - publish

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

before_script:
  - 'export PATH="$HOME/.docker/bin:/usr/local/bin:$PATH"'

# 1. UNIT TESTS
unit_tests:
  stage: test
  tags:
    - macos
  script:
    - 'python3 -m pip install -r backend/requirements.txt'
    - 'python3 -m pytest backend/tests/test_app.py -v'

# 2. SONARQUBE QUALITY CHECK
sonarqube_check:
  stage: quality
  tags:
    - macos
  script:
    - 'sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN"'

# 3. DOCKER BUILD
docker_build:
  stage: build
  tags:
    - macos
  script:
    - 'echo "Building Docker image: $IMAGE_NAME"'
    - 'docker build --pull -t "$IMAGE_NAME" ./backend'
    - 'echo "Docker image built successfully"'
    - 'docker images "$CI_REGISTRY_IMAGE"'

# 4. TRIVY SECURITY SCAN
trivy_scan:
  stage: scan
  tags:
    - macos
  script:
    - 'echo "Scanning Docker image: $IMAGE_NAME"'
    - 'trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_NAME"'
    - 'echo "Trivy scan completed successfully"'

# 5. PUBLISH IMAGE
publish_image:
  stage: publish
  tags:
    - macos
  script:
    - 'echo "Logging in to GitLab Container Registry"'
    - 'echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin'
    - 'echo "Publishing Docker image: $IMAGE_NAME"'
    - 'docker push "$IMAGE_NAME"'
    - 'echo "Docker image published successfully"'
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/usecase1"'