apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-demo
  template:
    metadata:
      labels:
        app: policy-demo
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80