
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-backend-uc8
  namespace: uc4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-backend-uc8
  template:
    metadata:
      labels:
        app: claims-backend-uc8
    spec:
      containers:
        - name: backend
          image: claims-backend:uc8
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: claims-config
            - secretRef:
                name: claims-db-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: claims-backend-uc8
  namespace: uc4
spec:
  selector:
    app: claims-backend-uc8
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
  type: ClusterIP
