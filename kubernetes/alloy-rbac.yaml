apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: uc4
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: uc8-alloy-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: uc8-alloy-reader-binding
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: uc4
roleRef:
  kind: ClusterRole
  name: uc8-alloy-reader
  apiGroup: rbac.authorization.k8s.io
  