apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase16-nginx
  namespace: usecase16
spec:
  replicas: 2
  selector:
    matchLabels:
      app: usecase16-nginx
  template:
    metadata:
      labels:
        app: usecase16-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
