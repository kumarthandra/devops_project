apiVersion: v1
kind: Pod

metadata:
  name: "{{ include "claims-backend-chart.fullname" . }}-test-connection"
  labels:
    {{- include "claims-backend-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test

spec:
  automountServiceAccountToken: false

  containers:
    - name: wget
      image: busybox:1.36.1
      command: ['wget']
      args:
        - '{{ include "claims-backend-chart.fullname" . }}:{{ .Values.service.port }}'
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
          ephemeral-storage: 10Mi
        limits:
          cpu: 50m
          memory: 32Mi
          ephemeral-storage: 50Mi

  restartPolicy: Never
